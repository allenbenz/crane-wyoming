when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  restore-cache:
    image: codeberg.org/landre/woodpecker/cache
    settings:
      action: download
      bucket: cryptomilk-codeberg-s3
      url: https://cryptomilk-codeberg-s3.nbg1.your-objectstorage.com
      path: /woodpecker/.cargo
      access_key_id:
        from_secret: s3_access_key
      secret_access_key:
        from_secret: s3_secret_key
    failure: ignore

  test:
    image: registry.opensuse.org/home/gladiac/container/containers/codeberg-rust:latest
    environment:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /woodpecker/.cargo
    commands:
      - cargo fmt --check
      - cargo build --release
      - cargo clippy -- -W clippy::pedantic -D warnings
      - cargo test

  cargo-deny:
    image: registry.opensuse.org/home/gladiac/container/containers/codeberg-rust:latest
    environment:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /woodpecker/.cargo
    commands:
      - cargo deny check

  save-cache:
    image: codeberg.org/landre/woodpecker/cache
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
    settings:
      action: upload
      bucket: cryptomilk-codeberg-s3
      url: https://cryptomilk-codeberg-s3.nbg1.your-objectstorage.com
      path: /woodpecker/.cargo
      access_key_id:
        from_secret: s3_access_key
      secret_access_key:
        from_secret: s3_secret_key
