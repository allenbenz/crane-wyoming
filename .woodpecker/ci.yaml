when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  restore-cache:
    image: codeberg.org/landre/woodpecker/cache
    settings:
      action: download
      bucket: cryptomilk-codeberg-s3
      url: https://cryptomilk-codeberg-s3.nbg1.your-objectstorage.com
      key: ${CI_REPO_NAME}-cargo-sccache
      path: /woodpecker/.cache
      access_key_id:
        from_secret: s3_access_key
      secret_access_key:
        from_secret: s3_secret_key
    failure: ignore

  test:
    image: registry.opensuse.org/home/gladiac/container/containers/codeberg-rust:latest
    environment:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /woodpecker/.cache/cargo
      # Incremental compilation is incompatible with sccache (it produces
      # per-session artifacts sccache can't reuse as cache entries) and
      # buys nothing here anyway, since target/ isn't persisted between
      # CI runs -- only CARGO_HOME/SCCACHE_DIR are.
      CARGO_INCREMENTAL: "0"
      SCCACHE_DIR: /woodpecker/.cache/sccache
      SCCACHE_CACHE_SIZE: "1G"
      RUSTC_WRAPPER: sccache
    commands:
      - mkdir -p "$SCCACHE_DIR"
      - cargo fmt --check
      - cargo build
      - cargo clippy -- -W clippy::pedantic -D warnings
      - cargo test
      - sccache -s

  cargo-deny:
    image: registry.opensuse.org/home/gladiac/container/containers/codeberg-rust:latest
    environment:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /woodpecker/.cache/cargo
    commands:
      - cargo deny check

  save-cache:
    image: codeberg.org/landre/woodpecker/cache
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
    settings:
      action: upload
      bucket: cryptomilk-codeberg-s3
      url: https://cryptomilk-codeberg-s3.nbg1.your-objectstorage.com
      key: ${CI_REPO_NAME}-cargo-sccache
      path: /woodpecker/.cache
      access_key_id:
        from_secret: s3_access_key
      secret_access_key:
        from_secret: s3_secret_key
