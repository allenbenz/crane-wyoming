when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  restore-cache:
    image: codeberg.org/landre/woodpecker/cache
    settings:
      action: download
      bucket: cryptomilk-codeberg-s3
      url: https://cryptomilk-codeberg-s3.nbg1.your-objectstorage.com
      key: ${CI_REPO_NAME}-cargo-sccache
      # Must be relative to this plugin's own WORKDIR (/woodpecker, see its
      # Dockerfile), not the absolute /woodpecker/.cache: on upload, tar
      # strips the leading `/` from an absolute path before archiving, so
      # on download the archive's now-relative `woodpecker/.cache/...`
      # entries get extracted relative to CWD (also /woodpecker),
      # landing at the doubled /woodpecker/woodpecker/.cache/... instead
      # of /woodpecker/.cache/... -- silently leaving the cache empty at
      # the path the test/cargo-deny steps actually look for it at.
      path: .cache
      access_key_id:
        from_secret: s3_access_key
      secret_access_key:
        from_secret: s3_secret_key
    failure: ignore

  test:
    image: registry.opensuse.org/home/gladiac/container/containers/codeberg-rust:latest
    environment:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /woodpecker/.cache/cargo
      # Incremental compilation is incompatible with sccache (it produces
      # per-session artifacts sccache can't reuse as cache entries) and
      # buys nothing here anyway, since target/ isn't persisted between
      # CI runs -- only CARGO_HOME/SCCACHE_DIR are.
      CARGO_INCREMENTAL: "0"
      SCCACHE_DIR: /woodpecker/.cache/sccache
      SCCACHE_CACHE_SIZE: "1G"
      RUSTC_WRAPPER: sccache
    commands:
      - mkdir -p "$SCCACHE_DIR"
      - cargo fmt --check
      - cargo build
      - cargo clippy -- -W clippy::pedantic -D warnings
      - cargo test
      - sccache --show-stats

  cargo-deny:
    image: registry.opensuse.org/home/gladiac/container/containers/codeberg-rust:latest
    environment:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /woodpecker/.cache/cargo
    commands:
      - cargo deny check

  save-cache:
    image: codeberg.org/landre/woodpecker/cache
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
    settings:
      action: upload
      bucket: cryptomilk-codeberg-s3
      url: https://cryptomilk-codeberg-s3.nbg1.your-objectstorage.com
      key: ${CI_REPO_NAME}-cargo-sccache
      # See restore-cache's `path` comment: must match (relative to this
      # plugin's own WORKDIR) or the two steps silently disagree on where
      # the cache actually lives.
      path: .cache
      access_key_id:
        from_secret: s3_access_key
      secret_access_key:
        from_secret: s3_secret_key
