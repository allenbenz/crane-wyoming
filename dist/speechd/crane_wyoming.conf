#
# Configuration for the sd_crane_wyoming speech-dispatcher output module.
#
# Install this file to:
#   /etc/speech-dispatcher/modules/crane_wyoming.conf        (system-wide)
# or:
#   ~/.config/speech-dispatcher/modules/crane_wyoming.conf   (per-user)
#

# CraneURI is the only directive this module understands. It is the
# Wyoming protocol URI of a running crane-wyoming server, using the same
# tcp:// or unix:// scheme accepted by crane-wyoming's own --uri flag.
#
# The socket path below matches the default crane-wyoming.socket unit in
# dist/systemd-user/ (%t/crane-wyoming/tts.sock, i.e. $XDG_RUNTIME_DIR).
# Replace "1000" with your own UID, or point this at $XDG_RUNTIME_DIR
# directly if your shell expands environment variables when writing this
# file (speech-dispatcher itself does not expand them at load time).
CraneURI "unix:///run/user/1000/crane-wyoming/tts.sock"

# To use this module, add the following to speech-dispatcher's own config
# (speechd.conf), then restart speech-dispatcher:
#
#   AddModule "crane" "sd_crane_wyoming" "crane_wyoming.conf"
#   DefaultModule crane
#
# Or, to use crane-wyoming only for specific languages, keep another
# module as DefaultModule and add instead:
#
#   LanguageDefaultModule "de" "crane"

# End of crane_wyoming.conf
