[package]
name = "wyoming-protocol"
version = "0.1.0"
description = "Wyoming protocol wire format and event types"
edition = "2024"
license = "MIT"
repository = "https://github.com/cryptomilk/crane-wyoming"
authors = ["Andreas Schneider <asn@cryptomilk.org>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
