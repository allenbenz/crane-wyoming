[workspace]

[package]
name = "crane-wyoming"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cryptomilk/crane-wyoming"
authors = ["Andreas Schneider <asn@cryptomilk.org>"]

[lib]
name = "crane_wyoming"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
