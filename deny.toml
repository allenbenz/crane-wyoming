# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# ── Advisories ─────────────────────────────────────────────────

[advisories]
# Fail on yanked crates.
yanked = "deny"
# Warn for unmaintained crates that are direct dependencies.
unmaintained = "workspace"

# ── Licenses ───────────────────────────────────────────────────

[licenses]
# The project is GPL-2.0-or-later, except `wyoming-protocol` (MIT) and
# `sd-crane-wyoming` (LGPL-2.1-or-later). All dependency licenses must
# be compatible.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "LGPL-2.1-or-later",
    "GPL-2.0-or-later",
    # Only reachable through the optional `mkl` feature; see the
    # additional-permission clause in LICENSE for the linking exception.
    "LicenseRef-Intel-Simplified-Software-License",
]

# intel-mkl-src has no SPDX `license` field; it redistributes Intel MKL
# under the proprietary Intel Simplified Software License (License.txt).
[[licenses.clarify]]
crate = "intel-mkl-src"
expression = "LicenseRef-Intel-Simplified-Software-License"
license-files = [
    { path = "License.txt", hash = 0x3bf8c2d0 },
]

# ── Bans ───────────────────────────────────────────────────────

[bans]
# Warn when the same crate appears in multiple versions.
multiple-versions = "warn"
# Disallow wildcard version requirements (e.g. `*`).
wildcards = "deny"
# The `crane`/`crane-core` git deps and the workspace's own path deps have
# no version requirement; none of these crates are published to crates.io.
allow-wildcard-paths = true

# ── Sources ────────────────────────────────────────────────────

[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/lucasjinreal/Crane",
]
